<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#58CC02" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Streak" />
<link rel="apple-touch-icon" href="icon.png" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" href="icon.png" />
<title>Daily Habit Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#58CC02;
    --green-dark:#46a302;
    --green-shadow:#3a8a02;
    --orange:#FF9600;
    --orange-dark:#e08400;
    --red:#FF4B4B;
    --blue:#1CB0F6;
    --bg:#FFFFFF;
    --surface:#F7F7F7;
    --surface-2:#EFEFEF;
    --text:#3C3C3C;
    --text-muted:#777;
    --border:#E5E5E5;
    --shadow: 0 4px 0 rgba(0,0,0,0.08);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root.auto{ }
  }
  :root.dark{
    --bg:#131F24; --surface:#1F2C32; --surface-2:#283A40;
    --text:#F1F7FB; --text-muted:#8AA0A8; --border:#2C3E45;
    --shadow:0 4px 0 rgba(0,0,0,0.4);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Nunito',system-ui,-apple-system,sans-serif;font-weight:700;overscroll-behavior:none}
  body{min-height:100vh;min-height:100dvh}
  .app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}

  /* Top bar */
  .topbar{padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10}
  .streak{display:flex;align-items:center;gap:10px}
  .flame{font-size:32px;line-height:1;filter:drop-shadow(0 0 6px rgba(255,150,0,.4))}
  .flame.pulse{animation:flamePulse .8s ease}
  @keyframes flamePulse{0%{transform:scale(1)}40%{transform:scale(1.35) rotate(-6deg)}100%{transform:scale(1)}}
  .streak-num{font-size:26px;font-weight:900;color:var(--orange);line-height:1}
  .streak-sub{font-size:11px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
  .theme-btn{background:var(--surface);border:2px solid var(--border);border-bottom-width:3px;border-radius:12px;width:42px;height:42px;font-size:18px;cursor:pointer;color:var(--text);display:flex;align-items:center;justify-content:center}
  .theme-btn:active{transform:translateY(1px);border-bottom-width:2px}

  /* Content */
  .content{flex:1;padding:16px 16px 110px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .view{display:none;animation:fadeSlide .25s ease}
  .view.active{display:block}
  @keyframes fadeSlide{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .date-head{font-size:22px;font-weight:800;margin:4px 0 4px}
  .date-sub{font-size:13px;color:var(--text-muted);font-weight:700;margin-bottom:14px}
  .progress-wrap{background:var(--surface-2);border-radius:999px;height:16px;overflow:hidden;margin-bottom:6px;position:relative}
  .progress-bar{height:100%;background:linear-gradient(90deg,var(--green),#7ed321);border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1);box-shadow:inset 0 -3px 0 rgba(0,0,0,.1)}
  .progress-text{display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-bottom:18px;font-weight:800}

  /* Tasks */
  .task-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
  .task{display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--border);border-bottom-width:4px;border-radius:16px;padding:14px 16px;min-height:60px;cursor:pointer;user-select:none;transition:transform .1s, background .2s, border-color .2s}
  .task:active{transform:translateY(2px);border-bottom-width:2px}
  .task.done{background:color-mix(in srgb, var(--green) 15%, var(--surface));border-color:var(--green)}
  .task.readonly{cursor:default}
  .task.readonly:active{transform:none;border-bottom-width:4px}
  .checkbox{flex-shrink:0;width:30px;height:30px;border-radius:50%;border:3px solid var(--border);display:flex;align-items:center;justify-content:center;background:var(--bg);transition:all .2s ease;color:transparent;font-size:18px;font-weight:900}
  .task.done .checkbox{background:var(--green);border-color:var(--green-dark);color:#fff}
  .task.done .checkbox.just-checked{animation:popIn .35s cubic-bezier(.2,1.6,.4,1)}
  @keyframes popIn{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
  .task-name{flex:1;font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .task.done .task-name{color:var(--text-muted)}
  .task.missed-past{background:color-mix(in srgb,var(--red) 10%,var(--surface));border-color:var(--red)}
  .task.missed-past .checkbox{border-color:var(--red);color:var(--red);background:color-mix(in srgb,var(--red) 15%,var(--bg))}
  .task.missed-past .task-name{color:var(--red)}

  /* Empty */
  .empty{text-align:center;padding:40px 20px;color:var(--text-muted)}
  .empty-emoji{font-size:60px;margin-bottom:12px}
  .empty h3{color:var(--text);margin:0 0 6px;font-size:20px}
  .empty p{margin:0 0 18px;font-size:14px;font-weight:700}

  /* Buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--green);color:#fff;border:none;border-bottom:4px solid var(--green-shadow);border-radius:14px;padding:14px 22px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;min-height:48px}
  .btn:active{transform:translateY(2px);border-bottom-width:2px}
  .btn.secondary{background:var(--surface);color:var(--text);border-bottom-color:var(--border);border:2px solid var(--border);border-bottom-width:4px}
  .btn.danger{background:var(--red);border-bottom-color:#c93838}
  .btn.full{width:100%}

  /* Week view */
  .week-view-toggle{display:flex;gap:6px;margin-bottom:14px}
  .week-view-btn{flex:1;padding:8px;border:2px solid var(--border);border-bottom-width:3px;border-radius:12px;background:var(--surface);font-family:inherit;font-weight:800;font-size:13px;color:var(--text);cursor:pointer}
  .week-view-btn.active{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--surface));color:var(--blue)}
  .week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:20px}
  .day-cell{aspect-ratio:1/1.4;background:var(--surface);border:2px solid var(--border);border-bottom-width:3px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:4px 2px;min-height:64px;overflow:hidden}
  .day-cell:active{transform:translateY(1px);border-bottom-width:2px}
  .day-cell.today{border-color:var(--blue);box-shadow:0 0 0 2px color-mix(in srgb,var(--blue) 30%,transparent)}
  .day-cell.selected{background:var(--blue);border-color:var(--blue)}
  .day-cell.selected .day-label,.day-cell.selected .day-num{color:#fff}
  .day-cell.selected.complete{background:var(--green-dark);border-color:var(--green-dark)}
  .day-cell.selected.missed{background:var(--red);border-color:#c93838}
  .day-cell.complete{background:color-mix(in srgb,var(--green) 18%, var(--surface));border-color:var(--green)}
  .day-cell.missed{background:color-mix(in srgb,var(--red) 12%, var(--surface));border-color:var(--red)}
  .day-cell.future{}
  .day-label{font-size:9px;color:var(--text-muted);font-weight:800;text-transform:uppercase;line-height:1}
  .day-num{font-size:16px;font-weight:900;margin:2px 0;line-height:1;color:var(--text)}
  .day-cell.past .day-label,.day-cell.past .day-num{color:var(--text-muted);opacity:.5}
  /* Calendar month view */
  .cal-header{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
  .cal-dow{text-align:center;font-size:10px;font-weight:800;color:var(--text-muted);text-transform:uppercase;padding:4px 0}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:16px}
  .cal-cell{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;cursor:pointer;border:2px solid transparent}
  .cal-cell.empty{cursor:default}
  .cal-cell.cal-today{border-color:var(--blue)}
  .cal-cell.cal-selected{background:var(--blue);color:#fff !important;border-color:var(--blue)}
  .cal-cell.cal-selected.cal-complete{background:var(--green-dark);border-color:var(--green-dark)}
  .cal-cell.cal-selected.cal-missed{background:var(--red);border-color:#c93838}
  .cal-cell.cal-complete{background:color-mix(in srgb,var(--green) 30%,var(--surface));color:var(--green-dark)}
  .cal-cell.cal-missed{background:color-mix(in srgb,var(--red) 25%,var(--surface));color:var(--red)}
  .cal-cell.cal-future,.cal-cell.cal-notask{color:var(--text-muted)}

  .week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .week-nav button{background:var(--surface);border:2px solid var(--border);border-bottom-width:3px;border-radius:12px;width:40px;height:40px;font-size:18px;color:var(--text);font-weight:900;cursor:pointer}
  .week-nav button:active{transform:translateY(1px);border-bottom-width:2px}
  .week-nav-title{font-weight:800;font-size:15px}

  /* Week all-tasks list */
  .week-day-block{margin-bottom:18px}
  .week-day-heading{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .week-day-heading-label{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.5px}
  .week-day-heading-label.is-today{color:var(--blue)}
  .week-day-heading-label.is-complete{color:var(--green)}
  .week-day-heading-label.is-missed{color:var(--red)}
  .week-day-heading-date{font-size:12px;color:var(--text-muted);font-weight:700}
  .week-day-heading-line{flex:1;height:2px;background:var(--border);border-radius:999px}
  .week-no-tasks{font-size:13px;color:var(--text-muted);font-weight:700;padding:6px 0}

  /* Edit view */
  .edit-row{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--border);border-bottom-width:3px;border-radius:14px;padding:8px 8px 8px 14px;margin-bottom:10px;transition:transform .25s, opacity .25s}
  .edit-row.removing{transform:translateX(120%);opacity:0}
  .edit-row .name{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .icon-btn{background:transparent;border:none;font-size:18px;cursor:pointer;color:var(--text-muted);width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}
  .icon-btn:active{background:var(--surface-2)}
  .icon-btn.del{color:var(--red)}
  .add-row{display:flex;gap:8px;margin-top:14px}
  .add-row input{flex:1;background:var(--surface);border:2px solid var(--border);border-bottom-width:3px;border-radius:14px;padding:12px 14px;font-family:inherit;font-weight:700;font-size:15px;color:var(--text);min-height:48px;outline:none}
  .add-row input:focus{border-color:var(--blue)}
  .add-row button{background:var(--blue);color:#fff;border:none;border-bottom:4px solid #1493d1;border-radius:14px;width:54px;font-size:24px;font-weight:900;cursor:pointer}
  .add-row button:active{transform:translateY(2px);border-bottom-width:2px}
  .meta{font-size:12px;color:var(--text-muted);margin-top:18px;text-align:center;font-weight:700}

  /* Bottom nav */
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:2px solid var(--border);display:flex;justify-content:space-around;padding:10px 0 calc(16px + var(--safe-bottom));max-width:480px;margin:0 auto;z-index:20}
  .nav-btn{flex:1;background:transparent;border:none;padding:6px 4px;cursor:pointer;color:var(--text-muted);font-family:inherit;font-weight:800;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;text-transform:uppercase;letter-spacing:.5px;min-height:44px}
  .nav-btn .ic{font-size:22px}
  .nav-btn.active{color:var(--green)}
  .nav-btn:active{transform:scale(.95)}

  /* Onboarding modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;animation:fadeSlide .2s ease}
  .modal{background:var(--bg);border-radius:20px;padding:24px;max-width:380px;width:100%;text-align:center}
  .modal h2{margin:8px 0;font-size:22px}
  .modal p{color:var(--text-muted);font-size:14px;margin:0 0 18px;font-weight:700}
  .modal .big{font-size:60px;margin-bottom:6px}

  /* Confetti */
  .confetti-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:200}
  .confetti{position:absolute;width:10px;height:14px;top:-20px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.8}}

  /* Toast */
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:800;z-index:50;animation:toastIn .25s ease}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translateX(-50%)}}

  .glow-overlay{position:fixed;inset:0;pointer-events:none;z-index:150;background:radial-gradient(circle at center, color-mix(in srgb,var(--green) 30%, transparent), transparent 60%);opacity:0;animation:glow 1.2s ease}
  @keyframes glow{0%{opacity:0}30%{opacity:1}100%{opacity:0}}

  /* Recurrent badge */
  .recurrent-badge{font-size:11px;color:var(--blue);font-weight:800;margin-left:4px;flex-shrink:0}

  /* Recurrent modal */
  .rec-modal{background:var(--bg);border-radius:20px;padding:20px;max-width:380px;width:100%;text-align:left}
  .rec-modal h3{margin:0 0 16px;font-size:18px;font-weight:900}
  .rec-section{margin-bottom:16px}
  .rec-label{font-size:12px;color:var(--text-muted);font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
  .rec-type-row{display:flex;gap:8px}
  .rec-type-btn{flex:1;padding:10px;border:2px solid var(--border);border-bottom-width:3px;border-radius:12px;background:var(--surface);font-family:inherit;font-weight:800;font-size:14px;color:var(--text);cursor:pointer}
  .rec-type-btn.active{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--surface));color:var(--blue)}
  .rec-every-row{display:flex;align-items:center;gap:10px}
  .rec-every-row input[type=number]{width:64px;background:var(--surface);border:2px solid var(--border);border-bottom-width:3px;border-radius:12px;padding:10px 12px;font-family:inherit;font-weight:800;font-size:16px;color:var(--text);text-align:center;outline:none}
  .rec-every-row input[type=number]:focus{border-color:var(--blue)}
  .rec-every-row span{font-size:14px;font-weight:700;color:var(--text-muted)}
  .rec-end-row{display:flex;gap:8px;margin-top:8px}
  .rec-end-btn{flex:1;padding:10px;border:2px solid var(--border);border-bottom-width:3px;border-radius:12px;background:var(--surface);font-family:inherit;font-weight:800;font-size:13px;color:var(--text);cursor:pointer}
  .rec-end-btn.active{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--surface));color:var(--blue)}
  .rec-end-date{width:100%;margin-top:8px;background:var(--surface);border:2px solid var(--border);border-bottom-width:3px;border-radius:12px;padding:10px 12px;font-family:inherit;font-weight:700;font-size:14px;color:var(--text);outline:none}
  .rec-end-date:focus{border-color:var(--blue)}
  .rec-days-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .rec-day-btn{aspect-ratio:1;border:2px solid var(--border);border-bottom-width:3px;border-radius:10px;background:var(--surface);font-family:inherit;font-weight:800;font-size:11px;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .rec-day-btn.active{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--surface));color:var(--blue)}
  .rec-actions{display:flex;gap:8px;margin-top:4px}

  /* Delete recurrent modal */
  .del-modal{background:var(--bg);border-radius:20px;padding:20px;max-width:340px;width:100%;text-align:center}
  .del-modal h3{margin:0 0 8px;font-size:17px}
  .del-modal p{font-size:13px;color:var(--text-muted);margin:0 0 18px}
  .del-modal-actions{display:flex;flex-direction:column;gap:8px}
  .del-from-row{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;text-align:left}
  .del-from-row label{font-size:12px;color:var(--text-muted);font-weight:800;text-transform:uppercase;letter-spacing:.5px}
  .del-from-row input{background:var(--surface);border:2px solid var(--border);border-bottom-width:3px;border-radius:12px;padding:10px 12px;font-family:inherit;font-weight:700;font-size:14px;color:var(--text);outline:none;width:100%}
  .del-from-row input:focus{border-color:var(--blue)}
  .login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;z-index:300}
  .login-card{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:16px}
  .login-card .logo{font-size:64px;line-height:1}
  .login-card h1{font-size:26px;font-weight:900;margin:0;color:var(--text)}
  .login-card p{font-size:13px;color:var(--text-muted);margin:0 0 4px;font-weight:700}
  .login-fields{width:100%;display:flex;flex-direction:column;gap:10px}
  .login-user-btn{width:100%;display:flex;align-items:center;gap:16px;background:var(--surface);border:2px solid var(--border);border-bottom-width:3px;border-radius:16px;padding:16px 18px;cursor:pointer;font-family:inherit;font-weight:700;font-size:16px;color:var(--text)}
  .login-user-btn:active{transform:translateY(1px);border-bottom-width:2px}
  .login-user-avatar{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;flex-shrink:0;letter-spacing:0;box-shadow:0 2px 8px rgba(0,0,0,.10)}
  .login-user-info{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
  .login-user-name{font-size:17px;font-weight:800}
  .login-user-sub{font-size:12px;color:var(--text-muted);font-weight:700}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="streak">
      <div class="flame" id="flame">🔥</div>
      <div>
        <div class="streak-num"><span id="streakNum">0</span> day<span id="dayS">s</span></div>
        <div class="streak-sub">Best: <span id="bestNum">0</span></div>
      </div>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="Toggle theme">🌙</button>
  <button class="theme-btn" id="logoutBtn" aria-label="Log out" style="font-size:14px">👤</button>
  </header>

  <main class="content">
    <!-- TODAY -->
    <section class="view active" id="view-today">
      <div class="date-head" id="dateHead"></div>
      <div class="date-sub" id="dateSub"></div>
      <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
      <div class="progress-text"><span id="progressLabel">0/0 done</span><span id="progressPct">0%</span></div>
      <ul class="task-list" id="taskList"></ul>
      <div id="emptyToday"></div>
    </section>

    <!-- WEEK -->
    <section class="view" id="view-week">
      <div class="week-view-toggle">
        <button class="week-view-btn active" id="btnViewWeek">Week</button>
        <button class="week-view-btn" id="btnViewMonth">Month</button>
      </div>
      <div id="weekPanel">
        <div class="week-nav">
          <button id="weekPrev" aria-label="Previous week">‹</button>
          <div class="week-nav-title" id="weekTitle">This Week</div>
          <button id="weekNext" aria-label="Next week">›</button>
        </div>
        <div class="week-strip" id="weekStrip"></div>
        <div id="weekTasksAll"></div>
      </div>
      <div id="monthPanel" style="display:none">
        <div class="week-nav">
          <button id="calPrev" aria-label="Previous month">‹</button>
          <div class="week-nav-title" id="calTitle"></div>
          <button id="calNext" aria-label="Next month">›</button>
        </div>
        <div class="cal-header" id="calHeader"></div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
    </section>

    <!-- EDIT -->
    <section class="view" id="view-edit">
      <div class="date-head" id="editDateHead"></div>
      <div class="date-sub" id="editDateSub"></div>
      <div class="week-nav" style="margin-bottom:14px">
        <button id="editPrev" aria-label="Previous day">‹</button>
        <div class="week-nav-title" id="editDayTitle"></div>

/* ============== STATE ============== */
const defaultState = {

/* ============== DATE HELPERS ============== */
function fmtDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayStr(){ return fmtDate(new Date()); }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function startOfWeek(d){
  const x = new Date(d); const day = x.getDay();
  const diff = (day===0?-6:1-day);
  x.setDate(x.getDate()+diff); x.setHours(0,0,0,0); return x;
}
function longDate(d){
  return d.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric', year:'numeric'});
}

/* ============== RECURRENT LOGIC ============== */
const RECURRENT_DAYS_AHEAD = 180;

function projectRecurrents(){
  if(!state.recurrents || !state.recurrents.length) return;
  if(!state.dayTasks) state.dayTasks = {};
  const today = new Date(); today.setHours(0,0,0,0);
  state.recurrents.forEach(rule => {
    const start = parseDate(rule.startDate);
    for(let i = 0; i <= RECURRENT_DAYS_AHEAD; i++){
      const d = addDays(today, i);
      if(d < start) continue;
      if(rule.endDate && d > parseDate(rule.endDate)) continue;
      const ds = fmtDate(d);
      let matches = false;
      if(rule.type === 'weekdays'){
        // getDay(): 0=Sun,1=Mon...6=Sat — rule.weekdays stores 0=Mon..6=Sun
        const jsDay = d.getDay();
        const appDay = jsDay === 0 ? 6 : jsDay - 1;
        matches = rule.weekdays.includes(appDay);
      } else {
        // every X days/weeks from startDate
        const diffMs = d - start;
        const diffDays = Math.round(diffMs / 86400000);
        const interval = rule.type === 'weeks' ? rule.every * 7 : rule.every;
        matches = diffDays % interval === 0;
      }
      if(!matches) continue;
      if(!state.dayTasks[ds]) state.dayTasks[ds] = [];
      const already = state.dayTasks[ds].some(t => t.recurrentId === rule.id);
      if(!already) state.dayTasks[ds].push({ id: 't_'+rule.id+'_'+ds, name: rule.name, recurrentId: rule.id });
    }
  });
}

function removeRecurrentFromFuture(ruleId, fromDate){
  if(!state.dayTasks) return;
  const from = parseDate(fromDate);
  Object.keys(state.dayTasks).forEach(ds => {
    const d = parseDate(ds);
    if(d >= from){
      state.dayTasks[ds] = state.dayTasks[ds].filter(t => t.recurrentId !== ruleId);
      if(state.dayTasks[ds].length === 0) delete state.dayTasks[ds];
    }
  });
}

let pendingRecurrent = null; // stores config while user types the name

/* ============== STREAK LOGIC ============== */
function tasksForDay(dateStr){ return (state.dayTasks && state.dayTasks[dateStr]) || []; }
function isDayComplete(dateStr){
  const tasks = tasksForDay(dateStr);
  if(tasks.length===0) return false;
  const rec = (state.records && state.records[dateStr]) || [];
  return tasks.every(t => rec.includes(t.id));
}
function recomputeStreaks(){
  let streak = 0;
  let d = new Date(); d.setHours(0,0,0,0);
  const today = fmtDate(d);
  if(isDayComplete(today)) { streak++; d = addDays(d,-1); }
  else { d = addDays(d,-1); }
  while(isDayComplete(fmtDate(d))){ streak++; d = addDays(d,-1); }
  state.streak = streak;
  if(streak > (state.bestStreak||0)) state.bestStreak = streak;
}

/* ============== RENDER ============== */
const $ = id => document.getElementById(id);

function render(justCheckedId){
  renderTop();
  renderToday(justCheckedId);
  renderWeek(justCheckedId);
  renderEdit();
}

function renderTop(){
  $('streakNum').textContent = state.streak||0;
  $('dayS').textContent = (state.streak||0)===1?'':'s';
  $('bestNum').textContent = state.bestStreak||0;
}

function renderToday(justCheckedId){
  const d = parseDate(todayViewDay);
  const realToday = todayStr();
  const isToday = todayViewDay === realToday;
  $('dateHead').textContent = isToday ? d.toLocaleDateString(undefined,{weekday:'long'}) : d.toLocaleDateString(undefined,{weekday:'long'});
  $('dateSub').textContent = d.toLocaleDateString(undefined,{month:'long', day:'numeric', year:'numeric'});
  const list = $('taskList'); list.innerHTML='';
  const empty = $('emptyToday'); empty.innerHTML='';
  const tasks = tasksForDay(todayViewDay);
  const rec = (state.records && state.records[todayViewDay]) || [];
  const isFuture = todayViewDay > realToday;
  if(tasks.length===0){
    const msg = isFuture ? 'No tasks planned for this day.' : isToday ? 'Add tasks for today to start a streak.' : 'No tasks were set for this day.';
    const emoji = isFuture ? '📅' : isToday ? '🎯' : '📅';
    empty.innerHTML = `<div class="empty"><div class="empty-emoji">${emoji}</div><h3>No tasks</h3><p>${msg}</p>${isToday?`<button class="btn" onclick="switchView('edit')">Add Tasks</button>`:''}</div>`;
    updateProgress(0,0); return;
  }
  const yesterday = fmtDate(addDays(new Date(), -1));
  const isEditable = todayViewDay === realToday || todayViewDay === yesterday;
  const isPastReadonly = !isEditable && !isFuture;
  tasks.forEach(t=>{
    const done = rec.includes(t.id);
    const li = document.createElement('li');
    li.className = 'task'+(done?' done':'')+(isEditable?'':' readonly')+(isPastReadonly && !done?' missed-past':'');
    li.innerHTML = `<div class="checkbox${done && t.id===justCheckedId ? ' just-checked' : ''}">${isPastReadonly && !done ? '✗' : '✓'}</div><div class="task-name" title="${escapeHtml(t.name)}">${escapeHtml(t.name)}</div>`;
    if(isEditable) li.addEventListener('click', ()=>toggleTaskOnDay(t.id, todayViewDay));
    list.appendChild(li);
  });
  updateProgress(rec.filter(id=>tasks.some(t=>t.id===id)).length, tasks.length);
}

function updateProgress(done, total){
  const pct = total? Math.round(done/total*100):0;
  $('progressBar').style.width = pct+'%';
  $('progressLabel').textContent = `${done}/${total} done`;
  $('progressPct').textContent = pct+'%';
}

function escapeHtml(s){ return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* Week view state */
let weekAnchor = startOfWeek(new Date());
let selectedDay = todayStr();
let weekViewMode = 'week';
let calAnchor = new Date();
/* Edit view state */
let editDay = todayStr();
/* Today view state */
let todayViewDay = todayStr();

function renderWeek(justCheckedId){
  if(weekViewMode === 'month'){ renderCalendar(); return; }
  const strip = $('weekStrip'); strip.innerHTML='';
  const today = todayStr();
  const sameWeek = fmtDate(startOfWeek(new Date()))===fmtDate(weekAnchor);
  $('weekTitle').textContent = sameWeek ? 'This Week' : weekAnchor.toLocaleDateString(undefined,{month:'long', year:'numeric'});
  for(let i=0;i<7;i++){
    const d = addDays(weekAnchor,i);
    const ds = fmtDate(d);
    const isToday = ds===today;
    const isFuture = d > new Date(new Date().setHours(23,59,59,999));
    const complete = isDayComplete(ds);
    const dayTasks = tasksForDay(ds);
    const missed = !complete && !isFuture && !isToday && dayTasks.length>0;
    const cell = document.createElement('div');
    const isPast = !isToday && !isFuture;
    cell.className = 'day-cell'+(isToday?' today':'')+(selectedDay===ds?' selected':'')+(complete?' complete':'')+(missed?' missed':'')+(isFuture?' future':'')+(isPast && !complete && !missed?' past':'');
    const label = d.toLocaleDateString(undefined,{weekday:'short'}).slice(0,3);
    cell.innerHTML = `<div class="day-label">${label}</div><div class="day-num">${d.getDate()}</div>`;
    cell.addEventListener('click', ()=>{ selectedDay = ds; renderWeek(); });
    strip.appendChild(cell);
  }
  renderWeekAllTasks(justCheckedId);
}

function renderWeekAllTasks(justCheckedId){
  const wrap = $('weekTasksAll'); wrap.innerHTML='';
  const today = todayStr();
  const yesterday = fmtDate(addDays(new Date(), -1));
  for(let i=0;i<7;i++){
    const d = addDays(weekAnchor,i);
    const ds = fmtDate(d);
    const isToday = ds===today;
    const isFuture = ds > today;
    const tasks = tasksForDay(ds);
    const rec = (state.records && state.records[ds]) || [];
    const complete = isDayComplete(ds);
    const missed = !complete && !isFuture && !isToday && tasks.length>0;
    const block = document.createElement('div');
    block.className = 'week-day-block';
    const labelCls = 'week-day-heading-label'+(isToday?' is-today':complete?' is-complete':missed?' is-missed':'');
    const dayLabel = d.toLocaleDateString(undefined,{weekday:'long'});
    const dayDate = d.toLocaleDateString(undefined,{month:'short', day:'numeric'});
    block.innerHTML = `<div class="week-day-heading"><span class="${labelCls}">${dayLabel}</span><span class="week-day-heading-date">${dayDate}</span><div class="week-day-heading-line"></div></div>`;
    if(tasks.length===0){
      const empty = document.createElement('div');
      empty.className='week-no-tasks'; empty.textContent='No tasks';
      block.appendChild(empty);
    } else {
      const isEditable = isToday || ds===yesterday;
      const ul = document.createElement('ul');
      ul.className='task-list'; ul.style.gap='6px';
      tasks.forEach(t=>{
        const done = rec.includes(t.id);
        const isPastReadonly = !isEditable && !isFuture;
        const li = document.createElement('li');
        li.className='task'+(done?' done':'')+(isEditable?'':' readonly')+(isPastReadonly&&!done?' missed-past':'');
        li.innerHTML=`<div class="checkbox${done&&t.id===justCheckedId?' just-checked':''}">${isPastReadonly&&!done?'✗':'✓'}</div><div class="task-name">${escapeHtml(t.name)}</div>`;
        if(isEditable) li.addEventListener('click',()=>toggleTaskOnDay(t.id,ds));
        ul.appendChild(li);
      });
      block.appendChild(ul);
    }
    wrap.appendChild(block);
  }
}

function renderCalendar(){
  const today = todayStr();
  const y = calAnchor.getFullYear(), m = calAnchor.getMonth();
  $('calTitle').textContent = calAnchor.toLocaleDateString(undefined,{month:'long', year:'numeric'});
  const hdr = $('calHeader'); hdr.innerHTML='';
  ['Mo','Tu','We','Th','Fr','Sa','Su'].forEach(d=>{ const el=document.createElement('div'); el.className='cal-dow'; el.textContent=d; hdr.appendChild(el); });
  const grid = $('calGrid'); grid.innerHTML='';
  const firstDay = new Date(y, m, 1);
  const offset = (firstDay.getDay() + 6) % 7;
  const daysInMonth = new Date(y, m+1, 0).getDate();
  for(let i=0; i<offset; i++){ const el=document.createElement('div'); el.className='cal-cell empty'; grid.appendChild(el); }
  for(let day=1; day<=daysInMonth; day++){
    const d = new Date(y, m, day);
    const ds = fmtDate(d);
    const isFuture = ds > today;
    const isToday = ds === today;
    const tasks = tasksForDay(ds);
    const complete = isDayComplete(ds);
    const missed = !complete && !isFuture && !isToday && tasks.length > 0;
    let cls = 'cal-cell';
    if(isToday) cls += ' cal-today';
    if(ds === selectedDay) cls += ' cal-selected';
    if(!isFuture && !isToday && complete) cls += ' cal-complete';
    else if(missed) cls += ' cal-missed';
    else if(isFuture || isToday) cls += ' cal-future';
    else cls += ' cal-notask';
    const el = document.createElement('div');
    el.className = cls;
    el.textContent = day;
    el.addEventListener('click', ()=>{ selectedDay = ds; renderCalendar(); });
    grid.appendChild(el);
  }
}

function renderDayDetail(justCheckedId){
  const wrap = $('dayDetail'); wrap.innerHTML='';

  const rec = (state.records && state.records[ds]) || [];

  const yesterday = fmtDate(addDays(new Date(), -1));
  const isEditable = ds === today || ds === yesterday;
  const tasks = tasksForDay(ds);
  const div = document.createElement('div');
  div.className = 'day-detail';
  let html = `<h4>${longDate(d)}</h4>`;
  if(tasks.length===0){
    html += `<div style="color:var(--text-muted);font-size:14px">No tasks for this day.</div>`;
  } else {
    html += '<ul class="task-list" style="gap:8px" id="weekTaskList"></ul>';
    html += `<div class="meta" style="margin-top:12px">${rec.filter(id=>tasks.some(t=>t.id===id)).length}/${tasks.length} completed${isEditable?'':' · read only'}</div>`;

  div.innerHTML = html;
  if(tasks.length>0){
    const ul = div.querySelector('#weekTaskList');

      if(isEditable) li.addEventListener('click', ()=>toggleTaskOnDay(t.id, ds));
      ul.appendChild(li);
    });
  }
  wrap.appendChild(div);
}

function renderEdit(){
  const wrap = $('editList'); wrap.innerHTML='';
  const d = parseDate(editDay);
  const today = todayStr();
  const isPast = editDay < today;
  const isToday = editDay === today;
  $('editDateHead').textContent = isToday ? 'Today' : d.toLocaleDateString(undefined,{weekday:'long'});
  $('editDateSub').textContent = d.toLocaleDateString(undefined,{month:'long', day:'numeric', year:'numeric'});
  $('editDayTitle').textContent = isToday ? 'Today' : d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
  const tasks = tasksForDay(editDay);
  if(isPast){
    $('addRowWrap').style.display = 'none';
    if(tasks.length===0) wrap.innerHTML = `<div class="empty"><div class="empty-emoji">📅</div><h3>No tasks</h3><p>No tasks were set for this day.</p></div>`;
  } else {
    $('addRowWrap').style.display = 'flex';
    if(tasks.length===0) wrap.innerHTML = `<div class="empty"><div class="empty-emoji">✏️</div><h3>No tasks yet</h3><p>Add tasks for this day below.</p></div>`;
  }
  tasks.forEach((t,i)=>{
    const row = document.createElement('div');
    row.className='edit-row';
    if(isPast){
      row.innerHTML = `<div class="name" title="${escapeHtml(t.name)}">${escapeHtml(t.name)}</div>`;
    } else {
      row.innerHTML = `
        <button class="icon-btn" data-act="up" ${i===0?'disabled style="opacity:.3"':''} aria-label="Move up">↑</button>
        <button class="icon-btn" data-act="down" ${i===tasks.length-1?'disabled style="opacity:.3"':''} aria-label="Move down">↓</button>
        <div class="name" title="${escapeHtml(t.name)}">${escapeHtml(t.name)}${t.recurrentId?'<span class="recurrent-badge">↻</span>':''}</div>
        <button class="icon-btn del" data-act="del" aria-label="Delete">🗑️</button>
      `;
      row.querySelectorAll('button').forEach(b=>{
        b.addEventListener('click',()=>{
          const act = b.dataset.act;
          if(!state.dayTasks) state.dayTasks = {};
          const dayTasks = state.dayTasks[editDay];
          if(act==='del'){
            if(t.recurrentId){
              showDeleteRecurrentModal(t, editDay, i);
            } else {
              row.classList.add('removing');
              setTimeout(()=>{ dayTasks.splice(i,1); recomputeStreaks(); save(); },220);
            }
          } else if(act==='up' && i>0){
            [dayTasks[i-1], dayTasks[i]] = [dayTasks[i], dayTasks[i-1]]; save();
          } else if(act==='down' && i<dayTasks.length-1){
            [dayTasks[i+1], dayTasks[i]] = [dayTasks[i], dayTasks[i+1]]; save();
          }
        });
      });
    }
    wrap.appendChild(row);
  });
  $('lastEdit').textContent = isPast ? 'Past day — read only' : `${tasks.length} task${tasks.length!==1?'s':''} for this day`;
}

/* ============== ACTIONS ============== */
function toggleTask(id){ toggleTaskOnDay(id, todayViewDay); }

function toggleTaskOnDay(id, ds){
  if(!state.records) state.records = {};
  const rec = state.records[ds] ? [...state.records[ds]] : [];
  const idx = rec.indexOf(id);
  const wasComplete = isDayComplete(ds);
  const justCheckedId = idx < 0 ? id : null;
  if(idx>=0) rec.splice(idx,1); else rec.push(id);
  state.records[ds] = rec;
  const nowComplete = isDayComplete(ds);
  recomputeStreaks();
  save();
  render(justCheckedId);
  if(!wasComplete && nowComplete && ds === todayStr()){ celebrate(); pulseFlame(); }
}

function addTask(){
  const inp = $('newTaskInput');
  const name = inp.value.trim();
  if(!name) return;
  if(!state.dayTasks) state.dayTasks = {};
  if(!state.dayTasks[editDay]) state.dayTasks[editDay] = [];
  state.dayTasks[editDay].push({id: 't_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), name});
  inp.value='';
  recomputeStreaks();
  save();
}

/* ============== TODAY SWIPE ============== */
(()=>{
  const el = $('view-today');
  let x0 = null;
  el.addEventListener('touchstart', e=>{ x0 = e.touches[0].clientX; }, {passive:true});
  el.addEventListener('touchend', e=>{
    if(x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    x0 = null;
    if(Math.abs(dx) < 40) return;
    todayViewDay = fmtDate(addDays(parseDate(todayViewDay), dx < 0 ? 1 : -1));
    renderToday();
  }, {passive:true});
})();

document.addEventListener('keydown', e=>{
  if(!$('view-today').classList.contains('active')) return;
  if(e.key === 'ArrowLeft') { todayViewDay = fmtDate(addDays(parseDate(todayViewDay), -1)); renderToday(); }
  else if(e.key === 'ArrowRight') { todayViewDay = fmtDate(addDays(parseDate(todayViewDay), 1)); renderToday(); }
});

/* ============== NAV ============== */
function switchView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  $('view-'+name).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===name));
}
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));
$('weekPrev').addEventListener('click',()=>{ weekAnchor = addDays(weekAnchor,-7); renderWeek(); });
$('weekNext').addEventListener('click',()=>{ weekAnchor = addDays(weekAnchor, 7); renderWeek(); });
$('calPrev').addEventListener('click',()=>{ calAnchor = new Date(calAnchor.getFullYear(), calAnchor.getMonth()-1, 1); renderCalendar(); });
$('calNext').addEventListener('click',()=>{ calAnchor = new Date(calAnchor.getFullYear(), calAnchor.getMonth()+1, 1); renderCalendar(); });
$('btnViewWeek').addEventListener('click',()=>{
  weekViewMode='week';
  $('btnViewWeek').classList.add('active'); $('btnViewMonth').classList.remove('active');
  $('weekPanel').style.display=''; $('monthPanel').style.display='none';
  renderWeek();
});
$('btnViewMonth').addEventListener('click',()=>{
  weekViewMode='month';
  $('btnViewMonth').classList.add('active'); $('btnViewWeek').classList.remove('active');
  $('weekPanel').style.display='none'; $('monthPanel').style.display='';
  renderCalendar();
});
$('addTaskBtn').addEventListener('click', addTask);
$('newTaskInput').addEventListener('keydown', e=>{ if(e.key==='Enter') addTask(); });
$('addRecBtn').addEventListener('click', () => { showRecurrentModal($('newTaskInput').value.trim()); });
$('editPrev').addEventListener('click',()=>{ editDay = fmtDate(addDays(parseDate(editDay),-1)); renderEdit(); });
$('editNext').addEventListener('click',()=>{ editDay = fmtDate(addDays(parseDate(editDay), 1)); renderEdit(); });

/* ============== THEME ============== */
function applyTheme(){
  const root = document.documentElement;
  root.classList.remove('dark','auto');
  const theme = (state && state.theme) ? state.theme : 'light';
  if(theme==='dark') root.classList.add('dark');
  $('themeBtn').textContent = theme==='dark'?'☀️':'🌙';
}
$('themeBtn').addEventListener('click',()=>{
  state.theme = state.theme==='dark'?'light':'dark';
  applyTheme(); save();
});

/* ============== CELEBRATIONS ============== */
function pulseFlame(){
  const f = $('flame'); f.classList.remove('pulse'); void f.offsetWidth; f.classList.add('pulse');
}
function celebrate(){
  const g = document.createElement('div'); g.className='glow-overlay';
  document.body.appendChild(g); setTimeout(()=>g.remove(),1200);
  const layer = document.createElement('div'); layer.className='confetti-layer';
  document.body.appendChild(layer);
  const colors = ['#58CC02','#FF9600','#1CB0F6','#FF4B4B','#CE82FF','#FFD600'];
  for(let i=0;i<60;i++){
    const c = document.createElement('div'); c.className='confetti';
    c.style.left = Math.random()*100+'%';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration = (1.6+Math.random()*1.4)+'s';
    c.style.animationDelay = (Math.random()*0.3)+'s';
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    c.style.borderRadius = Math.random()<0.4?'50%':'2px';
    layer.appendChild(c);
  }
  setTimeout(()=>layer.remove(), 3500);
  toast('All done! Streak +1 🔥');
}
function toast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2200);
}

/* ============== MIDNIGHT ROLLOVER ============== */
let currentDay = todayStr();
setInterval(()=>{
  const now = todayStr();
  if(now !== currentDay){ currentDay = now; recomputeStreaks(); save(); }
}, 30*1000);

/* ============== ONBOARDING ============== */
function showOnboarding(){
  if(document.getElementById('onboardingModal')) return;
  const bg = document.createElement('div'); bg.className='modal-bg'; bg.id='onboardingModal';
  bg.innerHTML = `<div class="modal"><div class="big">🔥</div><h2>Welcome to Streak</h2><p>Build daily habits, keep your streak alive. Add tasks for each day — you can set different tasks for different days.</p><button class="btn full" id="obStart">Let's go</button></div>`;
  document.body.appendChild(bg);
  bg.querySelector('#obStart').addEventListener('click',()=>{
    state.onboarded = true; save(); bg.remove(); switchView('edit'); $('newTaskInput').focus();
  });
}

/* ============== INIT ============== */
function initApp(username){
  currentUser = username;
  const data = USERS[username];
  const logoutBtn = $('logoutBtn');
  logoutBtn.textContent = data.initials;
  logoutBtn.style.cssText = `background:${data.bg};color:${data.color};border:none;border-radius:50%;width:36px;height:36px;font-size:15px;font-weight:900;cursor:pointer;flex-shrink:0;`;
  startSync(username);
}

$('logoutBtn').addEventListener('click', () => {
  if(dbUnsubscribe){ dbUnsubscribe(); dbUnsubscribe = null; }
  clearSession(); currentUser = null;
  showLoginScreen();
});

const savedUser = getSession();
if(savedUser && USERS[savedUser]){
  initApp(savedUser);
} else {
  clearSession();
  showLoginScreen();
}
</script>
